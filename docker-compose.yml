# Local development dependencies. Not a deployment topology.
services:
  postgres:
    image: postgres:17-alpine
    container_name: bailey-postgres
    environment:
      POSTGRES_USER: bailey_owner
      POSTGRES_PASSWORD: bailey_local_dev
      POSTGRES_DB: bailey
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bailey-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bailey_owner -d bailey"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bailey-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  bailey-pgdata:
